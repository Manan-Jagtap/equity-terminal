<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#060A13" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EquityVerdict — Independent Equity Research for Indian Markets</title>
    <meta name="description" content="Independent equity research terminal for Indian markets — transparent DCF valuations, a 7-factor Alpha Score, screeners, portfolios with risk analytics, and a public track record across Nifty 500 companies." />
    <meta name="theme-color" content="#0a0907" />

    <meta property="og:description" content="Transparent valuations, factor rankings and portfolio analytics for Nifty 500 companies — research that shows its work, with a track record that can't be faked." />
  </head>
  <style>
    /* Global guards: dark canvas everywhere (no white gutters when content
       overflows) and NO horizontal document overflow — one over-wide element
       otherwise makes iOS Safari zoom the whole layout out to fit, which
       flips every isMobile check back to desktop. Wide tables scroll inside
       their own overflow-x containers instead. */
    html, body { margin: 0; background: #060A13; overflow-x: hidden; }
    #root { overflow-x: clip; }
    /* Shared by components/Skeleton.jsx (inline styles can't declare keyframes). */
    @keyframes ev-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* UX-02 (WCAG 2.4.7): a visible keyboard-focus ring. Components strip the
       browser outline on inputs/selects for aesthetics; restore it for keyboard
       users only (:focus-visible doesn't fire on mouse click). */
    :focus-visible { outline: 2px solid #3EE6C1; outline-offset: 2px; border-radius: 2px; }
    /* UX-07 (WCAG 2.3.3 + vestibular safety): honour "reduce motion" — freeze the
       shimmer/spin/blink/fade animations and transitions for users who ask. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

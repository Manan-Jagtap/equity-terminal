name: CI

# Three gates on every push/PR:
#   1. Both parity harnesses vs the committed backend fixtures — the client's
#      engine.js/derive.js must stay bit-identical to the backend (60/60, 48/48).
#   2. Production build.
#   3. Playwright runtime smoke in seed mode — catches "builds fine, crashes at
#      runtime" failures a build cannot see (real incident 16 Jul 2026).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-parity-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      # ARC-08: lint ratchet. eslint still reports a pre-existing baseline of
      # react-hooks warnings, so this does not fail the build yet — but it runs
      # on every push so NEW no-unused-vars / errors are visible in the CI log,
      # and the count only goes down. Tighten to a hard gate once the baseline
      # (react-hooks/set-state-in-effect + static-components) is cleared.
      - name: Lint (report)
        run: npm run lint || true
      # SEC-13: dependency-CVE gate. Audit PRODUCTION deps only (--omit=dev):
      # a high in a shipped dependency reaches users and must block the merge,
      # while build-tool/dev advisories (vite, eslint, etc. — which never enter
      # the bundle) surface in the non-blocking report below without ever
      # blocking a deploy.
      - name: Dependency audit — production deps (block on high)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit — full tree (report only)
        run: npm audit || true
      - name: Engine parity (must be 60/60)
        run: node tests/engineParity.mjs
      - name: Derive parity (must be 48/48)
        run: node tests/deriveParity.mjs
      # The engine withholds a fair value while keeping its verdict. A surface
      # that reinvents the withheld number breaks the product's core claim —
      # and it has shipped TWICE, each time because the guard enumerated the
      # suppression shapes it knew about and missed the rest. This gates the
      # invariant (provenance, not populated-ness) instead of the shapes.
      - name: Suppression contract (no surface reinvents a withheld valuation)
        run: node tests/suppressionContract.mjs
      - name: Build
        run: npm run build
      - name: Bundle budget (entry ≤ 175 kB gzip)
        run: node scripts/check-bundle-budget.mjs
      # Colour is arithmetic, so it gets a numeric gate. Catches the class of
      # defect that is invisible in review: a verdict ladder that collapses for
      # dichromats, a text tier that fails AA on a surface it is used on, a
      # sector tint that wears a verdict colour, or a contrast ratio documented
      # in a comment that is simply not true. Every one of those shipped.
      - name: Palette invariants (dichromat safety + WCAG AA)
        run: node scripts/check-palette.mjs
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Runtime smoke (seed mode)
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

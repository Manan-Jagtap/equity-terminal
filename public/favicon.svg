<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- EquityVerdict — "Verdict Tick": a rising price line whose final leg is a
       checkmark. The chart and the judgment in one gesture. -->
  <defs>
    <linearGradient id="ev" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0A101E"/>
  <path d="M 12 44 L 24 31 L 30 37 L 52 14"
        fill="none" stroke="url(#ev)" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="12" cy="44" r="3.4" fill="#6EE7B7"/>
</svg>
